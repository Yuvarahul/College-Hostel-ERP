<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Profile</title>

<link rel="stylesheet" href="dashboard.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

<div class="main-content">

    <div class="welcome">
        <h2>My Profile</h2>
        <p>Your hostel registration and room details.</p>
    </div>

    <div class="card profile-card">

        <div class="profile-image">
            <img src="students.jpg" alt="Profile Photo">
        </div>

        <table class="profile-table">
            <tr><td>Full Name</td><td id="profileName">—</td></tr>
            <tr><td>Roll / Admission No.</td><td id="profileRoll">—</td></tr>
            <tr><td>Department</td><td id="profileDept">—</td></tr>
            <tr><td>Year</td><td id="profileYear">—</td></tr>
            <tr><td>Phone</td><td id="profilePhone">—</td></tr>
            <tr><td>Email</td><td id="profileEmail">—</td></tr>
            <tr><td>Parent/Guardian Phone</td><td id="profileParentPhone">—</td></tr>
            <tr><td>Address</td><td id="profileAddress">—</td></tr>
            <tr><td>Room Allocation</td><td id="profileRoom">—</td></tr>
        </table>

        <br>
        <a href="dashboard.html" class="back-to-dashboard">&larr; Back to Dashboard</a>
        <br><br>
        <button type="button" class="logout-btn">Logout</button>

    </div>

</div>

<script src="students.js"></script>
<script src="registrations.js"></script>
<script src="student.js"></script>

</body>
</html>
