<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Management | HostelERP</title>
<link rel="stylesheet" href="warden_dashboard.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
.management-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.management-card{background:var(--card-bg,#fff);border:1px solid var(--border,#e5e7eb);border-radius:14px;padding:18px;cursor:pointer}.management-card:hover{transform:translateY(-2px)}.management-card i{font-size:24px;margin-bottom:10px}.management-card h3{margin:0 0 5px}.management-card p{margin:0;color:var(--text-muted,#6b7280);font-size:13px}.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:16px 0}.toolbar select,.toolbar input,.form-grid input,.form-grid select,.form-grid textarea{padding:10px;border:1px solid #d1d5db;border-radius:8px;background:var(--card-bg,#fff);color:inherit}.toolbar input{flex:1;min-width:180px}.table-wrap{overflow:auto}.manage-table{width:100%;border-collapse:collapse}.manage-table th,.manage-table td{padding:10px;border-bottom:1px solid #e5e7eb;text-align:left;white-space:nowrap}.manage-table th{font-size:12px;text-transform:uppercase}.status-btn{border:0;border-radius:999px;padding:6px 11px;cursor:pointer}.active{background:#dcfce7;color:#166534}.inactive{background:#fee2e2;color:#991b1b}.actions{display:flex;gap:6px}.btn-small{padding:7px 10px;border:1px solid #d1d5db;border-radius:7px;background:transparent;cursor:pointer}.btn-primary{background:#2563eb;color:#fff;border:0;padding:9px 13px;border-radius:8px;cursor:pointer}.section{display:none}.section.show{display:block}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.form-grid textarea{min-height:80px;resize:vertical}.full{grid-column:1/-1}.report-box{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.report-stat{padding:14px;border:1px solid #e5e7eb;border-radius:10px}.report-stat strong{font-size:22px;display:block}.muted{color:var(--text-muted,#6b7280)}@media(max-width:900px){.management-grid{grid-template-columns:repeat(2,1fr)}.report-box{grid-template-columns:repeat(2,1fr)}}@media(max-width:600px){.management-grid,.form-grid{grid-template-columns:1fr}.report-box{grid-template-columns:1fr}}

.user-management-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin:18px 0}.user-management-card{background:var(--card-bg,#fff);border:1px solid var(--border,#e5e7eb);border-radius:14px;padding:18px}.user-management-card h3{margin:0 0 6px}.user-management-card .count{font-size:28px;font-weight:700;margin:8px 0}.user-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.detail-modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;padding:20px;z-index:1000}.detail-modal.show{display:flex}.detail-panel{width:min(850px,100%);max-height:85vh;overflow:auto;background:var(--card-bg,#fff);border-radius:16px;padding:22px}.detail-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:15px}.detail-item{border:1px solid #e5e7eb;border-radius:9px;padding:10px}.detail-item strong{display:block;font-size:12px;text-transform:uppercase;color:#6b7280;margin-bottom:4px}.detail-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}@media(max-width:900px){.user-management-grid{grid-template-columns:1fr}.detail-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app-shell"><div id="sidebar-root"></div><div class="main-content"><div id="topbar-root"></div><main class="page">
<div class="greeting-banner"><div><h2>Administration Management</h2><p>Manage users, hostel structure, access control, reports and system settings.</p></div><i class="fa-solid fa-user-shield greet-icon"></i></div>
<div class="management-grid" id="cards"></div>
<div class="user-management-grid" id="userCards">
  <div class="user-management-card"><i class="fa-solid fa-user-graduate"></i><h3>Student Details</h3><div class="count" id="studentCount">0</div><div class="muted">Registered students</div><div class="user-actions"><button class="btn-primary" onclick="openUserSection('students')">View Student Details</button></div></div>
  <div class="user-management-card"><i class="fa-solid fa-user-tie"></i><h3>Warden Details</h3><div class="count" id="wardenCount">0</div><div class="muted">Registered wardens</div><div class="user-actions"><button class="btn-primary" onclick="openUserSection('wardens')">View Warden Details</button></div></div>
  <div class="user-management-card"><i class="fa-solid fa-shield-halved"></i><h3>Gatekeeper Details</h3><div class="count" id="securityCount">0</div><div class="muted">Registered security staff</div><div class="user-actions"><button class="btn-primary" onclick="openUserSection('security')">View Gatekeeper Details</button></div></div>
</div>
<div class="detail-modal" id="detailModal"><div class="detail-panel"><div class="panel-title"><span id="detailTitle">User Details</span><button class="btn-small" onclick="closeDetails()">Close</button></div><div class="detail-grid" id="detailGrid"></div><div class="detail-actions" id="detailActions"></div></div></div>
<div class="card panel section" id="manageSection"><div class="panel-title"><span id="sectionTitle">Management</span><button class="btn-small" onclick="showHome()">Back</button></div><div class="toolbar"><input id="filterInput" placeholder="Search records..."><button class="btn-primary" id="addBtn"><i class="fa-solid fa-plus"></i> Add</button></div><div class="table-wrap"><table class="manage-table"><thead id="thead"></thead><tbody id="tbody"></tbody></table></div></div>
<div class="card panel section" id="formSection"><div class="panel-title"><span id="formTitle">Add</span><button class="btn-small" onclick="showHome()">Cancel</button></div><form id="entityForm"><div class="form-grid" id="formFields"></div><div style="margin-top:14px"><button class="btn-primary" type="submit">Save</button></div></form></div>
<div class="card panel section" id="reportSection"><div class="panel-title"><span>Reports</span><button class="btn-small" onclick="showHome()">Back</button></div><div id="reportBox" class="report-box"></div></div>
<div class="card panel section" id="settingsSection"><div class="panel-title"><span id="settingsTitle">Settings</span><button class="btn-small" onclick="showHome()">Back</button></div><form id="settingsForm"><div class="form-grid" id="settingsFields"></div><div style="margin-top:14px"><button class="btn-primary">Save Settings</button></div></form></div>
</main></div></div>
<script src="js/script.js"></script><script src="warden_dashboard.js"></script><script src="admin-shell.js"></script>
<script>
const API=(window.location.port==='3000')?'':'http://localhost:3000'; let data={}; let current=''; let editId=null;
const defs={
 students:{label:'Students',icon:'fa-users',type:'users',key:'admission_no',cols:['admission_no','full_name','department','year','room_no','status']},
 wardens:{label:'Wardens',icon:'fa-user-tie',type:'users',key:'employee_id',cols:['employee_id','full_name','department','Shift','email','status']},
 security:{label:'Security Staff',icon:'fa-shield-halved',type:'users',key:'gatekeeper_id',cols:['gatekeeper_id','full_name','role','shift','gate','status']},
 supervisors:{label:'Supervisors',icon:'fa-user-gear',type:'users',key:'supervisor_id',cols:['supervisor_id','full_name','department','email','phone_no','status']},
 rooms:{label:'Rooms',icon:'fa-bed',type:'entity',key:'room_id',cols:['room_id','block','floor','capacity','occupied','status']},
 blocks:{label:'Blocks',icon:'fa-building',type:'entity',key:'block_id',cols:['block_id','name','description','status']},
 departments:{label:'Departments',icon:'fa-graduation-cap',type:'entity',key:'department_id',cols:['department_id','name','hod','status']},
 roles:{label:'Roles',icon:'fa-user-lock',type:'entity',key:'role_id',cols:['role_id','name','description','status']},
 permissions:{label:'Permissions',icon:'fa-key',type:'entity',key:'permission_id',cols:['permission_id','name','description','status']},
 audit:{label:'Audit Logs',icon:'fa-clipboard-list',type:'readonly',key:'id',cols:['created_at','admin_id','action','entity','entity_id','details']}
};
const cards=[...Object.keys(defs), 'config','reports','settings'].map(k=>{const d=defs[k]||{label:k==='config'?'Hostel Configuration':k==='reports'?'Reports':'System Settings',icon:k==='config'?'fa-sliders':k==='reports'?'fa-chart-column':'fa-gear'};return `<div class="management-card" onclick="openSection('${k}')"><i class="fa-solid ${d.icon}"></i><h3>${d.label}</h3><p>${k==='reports'?'Generate live hostel summary':k==='audit'?'Review admin actions':'Manage '+d.label.toLowerCase()}</p></div>`}).join(''); document.getElementById('cards').innerHTML=cards;
function headers(){return {'Content-Type':'application/json','x-admin-id':localStorage.getItem('hostelERP_adminSession')||''}}
async function load(){const r=await fetch(`${API}/api/admin-management`,{headers:headers()}); const j=await r.json(); if(!r.ok) throw Error(j.message||'Unable to load'); data=j;}
function showHome(){document.querySelectorAll('.section').forEach(x=>x.classList.remove('show')); document.getElementById('cards').style.display='grid'; document.getElementById('userCards').style.display='grid'; current=''; closeDetails();}
async function openSection(k){try{if(!data.students)await load(); document.getElementById('cards').style.display='none'; document.getElementById('userCards').style.display='none'; current=k; document.querySelectorAll('.section').forEach(x=>x.classList.remove('show')); if(k==='reports'){document.getElementById('reportSection').classList.add('show'); await renderReport(); return;} if(k==='config'||k==='settings'){await renderSettings(k);return;} document.getElementById('manageSection').classList.add('show'); document.getElementById('sectionTitle').textContent=defs[k].label; document.getElementById('addBtn').style.display=defs[k].type==='readonly'?'none':''; renderTable();}catch(e){alert(e.message)}}
function renderTable(){const d=defs[current], rows=data[current]||[]; document.getElementById('thead').innerHTML='<tr>'+d.cols.map(c=>`<th>${c}</th>`).join('')+'<th>Actions</th></tr>'; const q=(document.getElementById('filterInput').value||'').toLowerCase(); const filtered=rows.filter(r=>JSON.stringify(r).toLowerCase().includes(q)); document.getElementById('tbody').innerHTML=filtered.map(r=>{const id=r[d.key]||r.id; const cells=d.cols.map(c=>`<td>${escapeHtml(r[c]||'')}</td>`).join(''); let action=''; if(d.type==='users') action=`<button class="btn-small" onclick="viewUser('${current}','${escapeAttr(id)}')">View Details</button><button class="status-btn ${String(r.status||'Active').toLowerCase()==='inactive'?'inactive':'active'}" onclick="toggleUser('${current}','${escapeAttr(id)}')">${String(r.status||'Active').toLowerCase()==='inactive'?'Activate':'Deactivate'}</button>`; else if(d.type==='entity') action=`<button class="btn-small" onclick="editEntity('${escapeAttr(id)}')">Edit</button><button class="btn-small" onclick="deleteEntity('${escapeAttr(id)}')">Delete</button>`; return `<tr>${cells}<td><div class="actions">${action}</div></td></tr>`}).join('')||`<tr><td colspan="${d.cols.length+1}" class="muted">No records found.</td></tr>`; document.getElementById('filterInput').oninput=renderTable;}
function escapeHtml(v){return String(v).replace(/[&<>'"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[m]))} function escapeAttr(v){return String(v).replace(/'/g,"\\'")}
async function toggleUser(entity,id){if(!confirm('Change this account status?'))return; const r=await fetch(`${API}/api/admin-management/users/${entity}/${encodeURIComponent(id)}/status`,{method:'PATCH',headers:headers()});const j=await r.json();if(!r.ok) return alert(j.message); await load();renderTable();}
document.getElementById('addBtn').onclick=()=>{if(defs[current].type==='entity')openForm(); else if(current==='supervisors')openForm();};
function openForm(item={}){document.querySelectorAll('.section').forEach(x=>x.classList.remove('show'));document.getElementById('formSection').classList.add('show');document.getElementById('formTitle').textContent=`${item[defs[current].key]?'Edit':'Add'} ${defs[current].label}`;editId=item[defs[current].key]||null; const fields=current==='rooms'?['room_id','block','floor','capacity','occupied','status']:current==='blocks'?['block_id','name','description','status']:current==='departments'?['department_id','name','hod','status']:current==='roles'?['role_id','name','description','status']:['permission_id','name','description','status']; document.getElementById('formFields').innerHTML=fields.map(f=>`<div><label>${f}</label><input name="${f}" value="${escapeHtml(item[f]||'')}" ${f===defs[current].key&&editId?'readonly':''}></div>`).join('');}
function editEntity(id){const item=(data[current]||[]).find(r=>String(r[defs[current].key])===String(id));openForm(item)}
async function deleteEntity(id){if(!confirm('Delete this record?'))return;const r=await fetch(`${API}/api/admin-management/entity/${current}/${encodeURIComponent(id)}`,{method:'DELETE',headers:headers()});const j=await r.json();if(!r.ok)return alert(j.message);await load();renderTable();}
document.getElementById('entityForm').onsubmit=async e=>{e.preventDefault();const obj=Object.fromEntries(new FormData(e.target).entries());const endpoint=current==='supervisors'?'supervisor':`entity/${current}`;const r=await fetch(`${API}/api/admin-management/${endpoint}`,{method:'POST',headers:headers(),body:JSON.stringify(obj)});const j=await r.json();if(!r.ok)return alert(j.message);await load();openSection(current);};
async function renderReport(){const r=await fetch(`${API}/api/admin-management/report`,{headers:headers()});const j=await r.json();if(!r.ok)return alert(j.message);const x=j.report;document.getElementById('reportBox').innerHTML=[['Students',x.students.total,x.students.active],['Wardens',x.wardens.total,x.wardens.active],['Security',x.security.total,x.security.active],['Supervisors',x.supervisors.total,x.supervisors.active],['Rooms',x.rooms.total,`${x.rooms.available} available`]].map(a=>`<div class="report-stat"><strong>${a[1]}</strong>${a[0]}<div class="muted">${a[2]}</div></div>`).join('')}
async function renderSettings(k){document.querySelectorAll('.section').forEach(x=>x.classList.remove('show'));document.getElementById('settingsSection').classList.add('show');document.getElementById('settingsTitle').textContent=k==='config'?'Hostel Configuration':'System Settings';const obj=k==='config'?data.config:data.settings;document.getElementById('settingsFields').innerHTML=Object.entries(obj).map(([key,val])=>`<div><label>${key}</label><input name="${key}" value="${typeof val==='boolean'?'':escapeHtml(val)}" data-bool="${typeof val==='boolean'}" type="${typeof val==='boolean'?'checkbox':'text'}" ${val===true?'checked':''}></div>`).join('');document.getElementById('settingsForm').onsubmit=async e=>{e.preventDefault();const out={};[...e.target.elements].filter(x=>x.name).forEach(x=>out[x.name]=x.dataset.bool==='true'?x.checked:x.value);const r=await fetch(`${API}/api/admin-management/settings/${k}`,{method:'PUT',headers:headers(),body:JSON.stringify(out)});const j=await r.json();if(!r.ok)return alert(j.message);await load();alert('Saved successfully.');};}
function updateUserCounts(){document.getElementById('studentCount').textContent=(data.students||[]).length;document.getElementById('wardenCount').textContent=(data.wardens||[]).length;document.getElementById('securityCount').textContent=(data.security||[]).length;}
function openUserSection(type){openSection(type)}
function viewUser(type,id){const d=defs[type];const row=(data[type]||[]).find(r=>String(r[d.key]||r.id)===String(id));if(!row)return;document.getElementById('detailTitle').textContent=`${d.label.slice(0,-1)} Details`;const hidden=['password'];document.getElementById('detailGrid').innerHTML=Object.entries(row).filter(([k])=>!hidden.includes(k.toLowerCase())).map(([k,v])=>`<div class="detail-item"><strong>${escapeHtml(k.replace(/_/g,' '))}</strong>${escapeHtml(v||'')}</div>`).join('');const inactive=String(row.status||'Active').toLowerCase()==='inactive';document.getElementById('detailActions').innerHTML=`<button class="btn-small" onclick="closeDetails()">Close</button><button class="status-btn ${inactive?'inactive':'active'}" onclick="closeDetails();toggleUser('${type}','${escapeAttr(id)}')">${inactive?'Activate Account':'Deactivate Account'}</button>`;document.getElementById('detailModal').classList.add('show')}
function closeDetails(){document.getElementById('detailModal').classList.remove('show')}
document.getElementById('detailModal').addEventListener('click',e=>{if(e.target.id==='detailModal')closeDetails()});
const _oldLoad=load; load=async function(){await _oldLoad();updateUserCounts();};
(async()=>{try{initAdminShell('management');await load();}catch(e){alert(e.message)}})();
</script>
</body></html>
