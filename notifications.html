<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notifications | HostelERP Warden Portal</title>
  <link rel="stylesheet" href="warden_dashboard.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    .notif-item {
      display: flex;
      align-items: flex-start;
      gap: 14px;
      padding: 16px 18px;
      border-radius: var(--radius-md);
      background: var(--white);
      box-shadow: var(--shadow-sm);
      margin-bottom: 12px;
      transition: var(--transition);
      position: relative;
    }

    .notif-item:hover {
      box-shadow: var(--shadow-md);
    }

    .notif-item.unread {
      border-left: 4px solid var(--royal-blue);
    }

    .notif-item .n-icon {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 17px;
      flex-shrink: 0;
    }

    .notif-item .n-body {
      flex: 1;
    }

    .notif-item .n-body p.n-text {
      font-size: 13.5px;
      font-weight: 500;
    }

    .notif-item .n-body p.n-time {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .notif-item .unread-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--danger);
      flex-shrink: 0;
      margin-top: 6px;
    }

    .notif-tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
    }

    .notif-tab {
      padding: 9px 18px;
      border-radius: 30px;
      font-size: 12.5px;
      font-weight: 600;
      background: var(--white);
      box-shadow: var(--shadow-sm);
      color: var(--text-muted);
    }

    .notif-tab.active {
      background: var(--royal-blue);
      color: #fff;
    }
  </style>
</head>

<body>

  <div class="app-shell">
    <div id="sidebar-root"></div>

    <div class="main-content">
      <div id="topbar-root"></div>

      <main class="page">
        <div class="breadcrumb"><a href="warden_dashboard.html">Dashboard</a> <i class="fa-solid fa-chevron-right"></i>
          Notifications</div>
        <div class="page-header"
          style="display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:12px;">
          <div>
            <h2>Notifications</h2>
            <p>System alerts generated automatically from outpass and leave activity.</p>
          </div>
          <button class="btn btn-outline" id="markAllBtn"><i class="fa-solid fa-check-double"></i> Mark all as
            read</button>
        </div>

        <div class="notif-tabs">
          <button class="notif-tab active" data-filter="all">All Messages</button>
          <button class="notif-tab" data-filter="unread">Unread Messages</button>
        </div>

        <div id="notifList"></div>
      </main>
    </div>
  </div>

  <script src="students.js"></script>
  <script src="registrations.js"></script>
  <script src="warden_dashboard.js"></script>
  <script>
    initShell("notifications", { showSearch: false });

    const NOTIF_ICON = { alert: "fa-triangle-exclamation", success: "fa-circle-check", warning: "fa-clock", info: "fa-circle-info" };
    const NOTIF_COLOR = { alert: "red", success: "green", warning: "amber", info: "blue" };
    let activeFilter = "all";

    function timeAgo(iso) {
      const diffMs = Date.now() - new Date(iso).getTime();
      const mins = Math.floor(diffMs / 60000);
      if (mins < 1) return "just now";
      if (mins < 60) return `${mins} min ago`;
      const hrs = Math.floor(mins / 60);
      if (hrs < 24) return `${hrs} hr ago`;
      return `${Math.floor(hrs / 24)} day(s) ago`;
    }

    function render() {
      let notifs = getNotifications();
      if (activeFilter === "unread") notifs = notifs.filter(n => !n.read);
      else if (activeFilter !== "all") notifs = notifs.filter(n => n.type === activeFilter);

      const list = document.getElementById("notifList");
      if (notifs.length === 0) {
        list.innerHTML = `<div class="empty-state"><i class="fa-solid fa-bell-slash"></i><h4>No notifications</h4><p>You're all caught up.</p></div>`;
        return;
      }
      list.innerHTML = notifs.map(n => `
      <div class="notif-item ${n.read ? "" : "unread"}">
        <div class="n-icon stat-icon ${NOTIF_COLOR[n.type]}"><i class="fa-solid ${NOTIF_ICON[n.type]}"></i></div>
        <div class="n-body">
          <p class="n-text">${n.title ? `<strong>${n.title}</strong> — ` : ""}${n.text}</p>
          <p class="n-time">${timeAgo(n.time)}</p>
        </div>
        ${!n.read ? `<span class="unread-dot" title="Unread"></span>` : ""}
        <button class="btn btn-ghost btn-sm" onclick="markRead(${n.id})" ${n.read ? "disabled" : ""}>${n.read ? "Read" : "Mark read"}</button>
      </div>`).join("");
    }

    function markRead(id) {
      markNotificationRead(id);
      render();
      refreshNotifBadges();
    }

    document.getElementById("markAllBtn").addEventListener("click", () => {
      markAllNotificationsRead();
      showToast("success", "All caught up", "Every notification has been marked as read.");
      render();
      refreshNotifBadges();
    });

    document.querySelectorAll(".notif-tab").forEach(tab => {
      tab.addEventListener("click", () => {
        document.querySelectorAll(".notif-tab").forEach(t => t.classList.remove("active"));
        tab.classList.add("active");
        activeFilter = tab.dataset.filter;
        render();
      });
    });

    // Initial load: show loading state then render immediately once backend data is ready
    document.getElementById("notifList").innerHTML = `
      <div class="empty-state">
        <i class="fa-solid fa-spinner fa-spin"></i>
        <h4>Loading messages...</h4>
      </div>`;

    fetchNotificationsFromBackend().then(() => {
      render();
      refreshNotifBadges();
    }).catch(() => {
      render();
    });
  </script>
</body>

</html>
