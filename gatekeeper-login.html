<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gatekeeper Login | Hostel Management ERP</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="bg-texture"></div>

<div class="auth-wrapper">

  <aside class="auth-panel">
    <div class="auth-panel-top">
      <div class="logo-slot"><img src="images/logo.png" alt="College Logo" class="college-logo">
      </div>
      <div>
        <div class="college-name">Agurchand Manmull Jain College</div>
        <div class="college-sub">Hostel Management ERP</div>
      </div>
    </div>

    <div class="id-card">
      <div class="id-card-chip"></div>
      <div class="id-card-role">🛡️ Gatekeeper Access</div>
      <div class="id-card-line"></div>
      <div class="id-card-line short"></div>
    </div>

    <div class="auth-panel-quote">
      <strong>Every entry, logged and verified.</strong>
      Scan gate passes and record student in/out times at the hostel gate.
    </div>
  </aside>

  <section class="auth-form-side">
    <div class="auth-card">
      <h1>Gatekeeper Login</h1>
      <p class="auth-sub">Enter your gatekeeper ID and password to continue.</p>

      <div class="alert" id="loginAlert"></div>

      <form id="gatekeeperLoginForm" novalidate>
        <div class="field">
          <label for="gGatekeeperId">Gatekeeper ID</label>
          <div class="input-wrap">
            <input type="text" id="gGatekeeperId" placeholder="e.g. SEC001" autocomplete="username" required>
          </div>
        </div>

        <div class="field has-icon">
          <label for="gPassword">Password</label>
          <div class="input-wrap">
            <input type="password" id="gPassword" placeholder="Enter your password" autocomplete="current-password" required>
            <button type="button" class="toggle-pass" data-target="gPassword" aria-label="Show password">👁️</button>
          </div>
        </div>

        <button type="submit" class="btn-primary">Login</button>
      </form>

      <div class="link-row" style="justify-content:center;">
        <a href="#" class="forgot-pass-link">Forgot Password?</a>
      </div>

      <a href="index.html" class="back-home">← Back to Home</a>
    </div>
  </section>

</div>

<script src="gatekeeper/gatekeeper-data.js"></script>
<script src="js/script.js"></script>
</body>
</html>
