<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wardens | HostelERP Admin Portal</title>
<link rel="stylesheet" href="warden_dashboard.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
  .wd-table { width:100%; border-collapse:collapse; background:var(--white); border-radius:var(--radius-md); overflow:hidden; box-shadow:var(--shadow-sm); }
  .wd-table th, .wd-table td { padding:14px 16px; text-align:left; font-size:12.5px; border-bottom:1px solid rgba(11,61,145,0.06); }
  .wd-table th { color:var(--text-muted); text-transform:uppercase; font-size:11px; letter-spacing:0.4px; }
  .wd-table tr:last-child td { border-bottom:none; }
  .wd-actions { display:flex; gap:8px; }
  .wd-actions .btn { padding:6px 10px; font-size:11.5px; }
</style>
</head>
<body>

  <div class="app-shell">
    <div id="sidebar-root"></div>

    <div class="main-content">
      <div id="topbar-root"></div>

      <main class="page">
        <div class="breadcrumb"><a href="admin-dashboard.html">Dashboard</a> <i class="fa-solid fa-chevron-right"></i> Wardens</div>
        <div class="page-header">
          <h2>Wardens</h2>
          <p>All registered Warden accounts across the hostel.</p>
        </div>

        <div class="filter-bar">
          <div class="search-box" style="background:var(--grey-bg);">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" id="searchInput" placeholder="Search by name, employee ID or department...">
          </div>
          <span class="result-count" id="resultCount">0 wardens</span>
        </div>

        <table class="wd-table">
          <thead>
            <tr>
              <th>Employee ID</th><th>Name</th><th>Department</th><th>Phone</th><th>Email</th><th>Status</th><th>Actions</th>
            </tr>
          </thead>
          <tbody id="wardenTableBody"></tbody>
        </table>
        <div id="wardenEmptyState"></div>
      </main>
    </div>
  </div>

<script src="students.js"></script>
<script src="registrations.js"></script>
<script src="rooms.js"></script>
<script src="js/script.js"></script>
<script src="warden_dashboard.js"></script>
<script src="admin-shell.js"></script>
<script src="admin-data.js"></script>
<script>
  if (initAdminShell("wardens")) {
    let query = "";

    function getFiltered() {
      const q = query.trim().toLowerCase();
      return getAllWardens().filter(w =>
        !q || w.name.toLowerCase().includes(q) || w.employeeId.toLowerCase().includes(q) || (w.department || "").toLowerCase().includes(q)
      );
    }

    function render() {
      const list = getFiltered();
      document.getElementById("resultCount").textContent = `${list.length} warden${list.length === 1 ? "" : "s"}`;
      const body = document.getElementById("wardenTableBody");
      const empty = document.getElementById("wardenEmptyState");

      if (list.length === 0) {
        body.innerHTML = "";
        empty.innerHTML = `<div class="empty-state"><i class="fa-solid fa-user-tie"></i><h4>No wardens found</h4><p>Try a different search term.</p></div>`;
        return;
      }
      empty.innerHTML = "";

      body.innerHTML = list.map(w => `
        <tr>
          <td>${w.employeeId}</td>
          <td>${w.name}</td>
          <td>${w.department || "—"}</td>
          <td>${w.phone || "—"}</td>
          <td>${w.email || "—"}</td>
          <td><span class="badge ${w.status === "Inactive" ? "badge-rejected" : "badge-approved"}"><i></i>${w.status || "Active"}</span></td>
          <td>
            <div class="wd-actions">
              <button class="btn btn-outline" onclick="viewWarden('${w.employeeId}')"><i class="fa-solid fa-eye"></i> View</button>
              <button class="btn ${w.status === "Inactive" ? "btn-success" : "btn-danger"}" onclick="toggleWardenStatus('${w.employeeId}')">
                <i class="fa-solid ${w.status === "Inactive" ? "fa-toggle-on" : "fa-toggle-off"}"></i> ${w.status === "Inactive" ? "Activate" : "Deactivate"}
              </button>
            </div>
          </td>
        </tr>`).join("");
    }

    function viewWarden(employeeId) {
      const w = getAllWardens().find(x => x.employeeId === employeeId);
      if (!w) return;
      openDetailsModal({
        title: w.name,
        bodyHtml: `
          <p><strong>Employee ID:</strong> ${w.employeeId}</p>
          <p><strong>Department:</strong> ${w.department || "—"}</p>
          <p><strong>Email:</strong> ${w.email || "—"}</p>
          <p><strong>Phone:</strong> ${w.phone || "—"}</p>
          <p><strong>Address:</strong> ${w.address || "—"}</p>
          <p><strong>Status:</strong> ${w.status || "Active"}</p>
        `
      });
    }

    function toggleWardenStatus(employeeId) {
      const w = getAllWardens().find(x => x.employeeId === employeeId);
      if (!w) return;
      const next = w.status === "Inactive" ? "Active" : "Inactive";
      openConfirmModal({
        title: next === "Inactive" ? "Deactivate warden?" : "Activate warden?",
        message: `${w.name} (${w.employeeId}) will be ${next === "Inactive" ? "unable" : "able"} to log in to the Warden Portal.`,
        confirmLabel: next === "Inactive" ? "Deactivate" : "Activate",
        confirmClass: next === "Inactive" ? "btn-danger" : "btn-primary",
        onConfirm: () => {
          setWardenStatus(employeeId, next);
          showToast(next === "Inactive" ? "warning" : "success", "Status updated", `${w.name} is now ${next}.`);
          render();
        }
      });
    }

    document.getElementById("searchInput").addEventListener("input", (e) => { query = e.target.value; render(); });
    render();
  }
</script>
</body>
</html>
